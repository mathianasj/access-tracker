backend:
  image: quay.io/mathianasj/access-tracker-server:latest
  replicaCount: 2
  pullPolicy: Always
  port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

frontend:
  image: quay.io/mathianasj/access-tracker-frontend:latest
  replicaCount: 2
  pullPolicy: Always
  port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  enabled: true
  auth:
    database: access_tracker
    username: access_tracker
    password: "access_tracker_password"
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

service:
  backend:
    port: 8080
    type: ClusterIP
  frontend:
    port: 80
    type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: access-tracker.example.com
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

monitoring:
  enabled: true

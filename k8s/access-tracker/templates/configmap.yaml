apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "access-tracker.fullname" . }}
  labels:
    {{- include "access-tracker.labels" . | nindent 4 }}
data:
  DATABASE_URL: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "access-tracker.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
  GRAPHQL_ENDPOINT: "http://{{ include "access-tracker.fullname" . }}-backend:{{ .Values.backend.port }}/graphql"

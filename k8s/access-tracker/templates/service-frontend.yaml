apiVersion: v1
kind: Service
metadata:
  name: {{ include "access-tracker.fullname" . }}-frontend
  labels:
    {{- include "access-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "access-tracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
